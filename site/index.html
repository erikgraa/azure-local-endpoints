<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azure Local Endpoints</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--line:#263049;--text:#e6ebf5;--mute:#8b97b3;--accent:#4aa3ff;--ok:#3ecf8e;--warn:#f5b84a}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  header a{color:var(--accent);text-decoration:none;font-size:13px}
  .badge{background:#22304d;color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px}
  .right{margin-left:auto;display:flex;gap:16px}
  .tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
  .tab{padding:10px 16px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
  .tab.active{color:var(--text);border-color:var(--accent)}
  main{padding:20px 24px;display:none}main.active{display:block}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font:inherit}
  input[type=search]{flex:1;min-width:240px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:3px 11px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--mute);user-select:none}
  .chip.on{background:var(--accent);color:#04111f;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em;position:sticky;top:0;background:var(--panel)}
  tr:hover td{background:#1c2540}
  code{font-family:Consolas,monospace;color:#9fd1ff;word-break:break-all}
  .tag{font-size:11px;padding:1px 8px;border-radius:4px;background:#22304d;margin-right:4px;white-space:nowrap}
  .tag.wild{background:#4d3a14;color:var(--warn)}
  .tag.ok{background:#123d2b;color:var(--ok)}
  .count{color:var(--mute);margin:0 0 10px}
  .gen{display:grid;grid-template-columns:300px 1fr;gap:20px}
  @media(max-width:800px){.gen{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
  .card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;color:var(--mute)}
  .card label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}
  .card select,.card input{width:100%}
  pre{margin:0;background:#0b0f19;border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;max-height:600px;font:13px/1.5 Consolas,monospace;color:#cfe3ff}
  button{background:var(--accent);color:#04111f;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
  button.sec{background:#22304d;color:var(--text)}
  .actions{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .note{color:var(--mute);font-size:12px;margin-top:12px}
  .mute{color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>☁️ Azure Local Endpoints</h1><span class="badge" id="updated">loading…</span>
  <div class="right">
    <a href="api/v1/index.json">API</a>
    <a href="https://github.com/erikgraa/azure-local-endpoints">GitHub</a>
  </div>
</header>
<div class="tabs">
  <div class="tab active" data-t="browse">Browse endpoints</div>
  <div class="tab" data-t="gen">Generate firewall config</div>
</div>

<main id="browse" class="active">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search URL, component, notes…">
    <select id="scope"></select>
    <select id="phase"><option value="">Required for: any</option></select>
    <select id="port"><option value="">Port: any</option></select>
    <button class="sec" id="csv">⬇ Export CSV</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <table>
    <thead><tr><th><input type="checkbox" id="all" checked></th><th>Component</th><th>Endpoint</th><th>Port</th><th>Required for</th><th>Arc GW</th><th>Notes</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<main id="gen">
  <div class="gen">
    <div class="card">
      <h3>Options</h3>
      <label>Firewall vendor</label><select id="vendor"></select>
      <p class="note" id="vdesc" style="margin-top:6px"></p>
      <label>Rule name prefix</label><input id="prefix" value="azlocal">
      <label>Source zone</label><input id="szone" value="trust">
      <label>Destination zone</label><input id="dzone" value="untrust">
      <label>Source address / object</label><input id="saddr" value="any">
      <label>Action</label><select id="action"><option>allow</option><option>deny</option></select>
      <p class="note" id="selnote"></p>
      <p class="note">Uses the scope and the endpoints currently selected in the Browse tab. Generation runs in your browser.</p>
    </div>
    <div>
      <div class="actions"><button id="copy">Copy</button><button class="sec" id="dl">Download .tf</button><span class="note" id="fn" style="margin:0"></span></div>
      <pre id="code"></pre>
    </div>
  </div>
</main>

<script type="module">
import { generators } from './generators/index.js';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const index = await (await fetch('api/v1/index.json')).json();
let scope, selected = new Set(), visible = [];

$('updated').textContent = `built ${index.generated.slice(0, 10)}`;
$('scope').innerHTML = ['region', 'oem'].map((t) =>
  `<optgroup label="${t === 'region' ? 'Regions' : 'OEM vendors'}">${index.scopes.filter((s) => s.type === t)
    .map((s) => `<option value="${s.type}/${s.name}">${s.name} (${s.count})</option>`).join('')}</optgroup>`).join('');
$('vendor').innerHTML = generators.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join('');

const hash = decodeURIComponent(location.hash.slice(1));
if ([...$('scope').options].some((o) => o.value === hash)) $('scope').value = hash;
else $('scope').value = 'region/westeurope';

async function loadScope() {
  const s = index.scopes.find((x) => `${x.type}/${x.name}` === $('scope').value);
  scope = await (await fetch(s.url)).json();
  location.hash = $('scope').value;
  const eps = scope.endpoints;
  selected = new Set(eps.map((e) => e.id));
  const opts = (vals, el, first) => { el.innerHTML = `<option value="">${first}</option>` + vals.map((v) => `<option>${esc(v)}</option>`).join(''); };
  opts([...new Set(eps.flatMap((e) => e.requiredFor))].sort(), $('phase'), 'Required for: any');
  opts([...new Set(eps.flatMap((e) => e.ports))].sort((a, b) => a - b), $('port'), 'Port: any');
  $('chips').innerHTML = '';
  [...new Set(eps.map((e) => e.component))].sort().forEach((c) => {
    const el = document.createElement('span');
    el.className = 'chip on'; el.textContent = c;
    el.onclick = () => { el.classList.toggle('on'); render(); };
    $('chips').appendChild(el);
  });
  $('all').checked = true;
  render();
}

function render() {
  const q = $('q').value.toLowerCase(), ph = $('phase').value, port = $('port').value;
  const on = new Set([...$('chips').children].filter((c) => c.classList.contains('on')).map((c) => c.textContent));
  visible = scope.endpoints.filter((e) => on.has(e.component) && (!ph || e.requiredFor.includes(ph)) &&
    (!port || e.ports.includes(Number(port))) &&
    (!q || `${e.url} ${e.component} ${e.notes}`.toLowerCase().includes(q)));
  $('rows').innerHTML = visible.map((e) => `<tr><td><input type="checkbox" data-id="${e.id}" ${selected.has(e.id) ? 'checked' : ''}></td>
    <td>${esc(e.component)}</td><td><code>${esc(e.url)}</code>${e.wildcard ? ' <span class="tag wild">wildcard</span>' : ''}</td>
    <td>${e.ports.join(', ')}${e.protocol === 'udp' ? ' <span class="tag">udp</span>' : ''}</td>
    <td>${e.requiredFor.map((r) => `<span class="tag">${esc(r)}</span>`).join('')}</td>
    <td>${/^yes/i.test(e.arcGateway) ? `<span class="tag ok" title="${esc(e.arcGateway)}">Yes</span>` : `<span class="mute" title="${esc(e.arcGateway)}">${esc(e.arcGateway.split('.')[0] || '–')}</span>`}</td>
    <td class="mute">${esc(e.notes)}</td></tr>`).join('');
  $('count').textContent = `Showing ${visible.length} of ${scope.endpoints.length} endpoints · ${selected.size} selected for generation`;
  generate();
}

function generate() {
  const g = generators.find((x) => x.id === $('vendor').value);
  $('vdesc').textContent = g.description;
  const eps = scope.endpoints.filter((e) => selected.has(e.id));
  $('selnote').textContent = `${eps.length} endpoints selected`;
  const files = g.generate(eps, {
    prefix: $('prefix').value.trim() || 'azlocal', action: $('action').value, sourceZone: $('szone').value,
    destinationZone: $('dzone').value, sourceAddress: $('saddr').value, scope: scope.name
  });
  $('code').textContent = files.map((f) => f.content).join('\n');
  $('fn').textContent = files.map((f) => f.filename).join(', ');
  generate.files = files;
}

$('rows').onchange = (ev) => {
  const id = ev.target.dataset.id;
  ev.target.checked ? selected.add(id) : selected.delete(id);
  render();
};
$('all').onchange = (ev) => {
  visible.forEach((e) => (ev.target.checked ? selected.add(e.id) : selected.delete(e.id)));
  render();
};
['q'].forEach((id) => ($(id).oninput = render));
['phase', 'port'].forEach((id) => ($(id).onchange = render));
['vendor', 'action'].forEach((id) => ($(id).onchange = generate));
['prefix', 'szone', 'dzone', 'saddr'].forEach((id) => ($(id).oninput = generate));
$('scope').onchange = loadScope;
$('copy').onclick = () => navigator.clipboard.writeText($('code').textContent);
$('dl').onclick = () => {
  const f = generate.files[0];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([generate.files.map((x) => x.content).join('\n')], { type: 'text/plain' }));
  a.download = f.filename; a.click();
};
$('csv').onclick = () => {
  const rows = [['component', 'endpoint', 'port', 'requiredFor', 'wildcard', 'notes'],
    ...visible.map((e) => [e.component, e.url, e.ports.join(' '), e.requiredFor.join('/'), e.wildcard, e.notes])];
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `azure-local-${scope.name}.csv`; a.click();
};
document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => {
  document.querySelectorAll('.tab,main').forEach((e) => e.classList.remove('active'));
  t.classList.add('active'); $(t.dataset.t).classList.add('active');
}));
await loadScope();
</script>
</body>
</html>
