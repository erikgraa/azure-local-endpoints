name: Update Azure Local Endpoints

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'releases/**'
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Generate JSON files for Azure Local Endpoints
        shell: pwsh
        run: |
          Import-Module ('{0}\scripts\Export-AzureLocalEndpoints.ps1' -f $env:GITHUB_WORKSPACE) 
          $fileName = ($env:GITHUB_REPOSITORY -split '/')[-1]
          Export-AzureLocalEndpoints -FileName $fileName

      - name: Commit changes
        uses: EndBug/add-and-commit@v4
        with:
          message: "Auto updating required endpoints for Azure Local"
          add: "."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - uses: hashicorp/setup-terraform@v3

      - name: Validate generated Terraform (fmt + validate)
        run: npm run validate:terraform

      - name: Build site (UI, API and Terraform)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
