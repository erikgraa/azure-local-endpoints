# Everything is static and refreshed nightly, so there are no hashed file names: have clients revalidate
# (ETag / Last-Modified) instead of caching blindly. Icons rarely change and may be cached for a day.
map $uri $azl_cache_control {
    default                          "no-cache";
    ~*\.(svg|ico|png)$               "public, max-age=86400";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # add_header is inherited only when a location defines none of its own, so these live at server level only.
    add_header Cache-Control $azl_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The API and generated Terraform are public data; allow browsers on other origins to read them.
    add_header Access-Control-Allow-Origin "*" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated Terraform has no MIME mapping; serve it as text so browsers show it instead of downloading it.
    location ~* \.tf$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Directory listing makes the pre-generated files easy to browse (also when offline).
    location /terraform/ {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
